packages:
  - apps/*
  - packages/*

# pnpm 11 runs no install scripts unless a package is listed here.
allowBuilds:
  esbuild: false
  workerd: true
  sharp: false

catalog:
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.19.2
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

minimumReleaseAgeExclude:
  - knip@6.42.1
  - "@shadcn/lint@0.2.3"
  - "@cloudflare/workerd-darwin-64@1.20261019.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261019.1"
  - "@cloudflare/workerd-linux-64@1.20261019.1"
  - "@cloudflare/workerd-linux-arm64@1.20261019.1"
  - "@cloudflare/workerd-windows-64@1.20261019.1"
  - miniflare@5.20261019.0-beta
  - workerd@1.20261019.1
  - wrangler@4.151.2
