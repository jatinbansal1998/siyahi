name: Publish

# Every merge to main ships both packages as a pre-release: tarballs on a
# GitHub release (always), and npm under the `next` dist-tag, which `latest`
# follows until 1.0.0. Stable versions are cut by hand.
#
# A push that changes only docs/, Markdown at the repo root or the agent skills
# under .agents/ (.claude/skills links there) ships nothing new, so it
# publishes nothing. CI still runs `check` on it. `*.md` matches the root
# only: package READMEs and notices ship in the tarballs, and the root README,
# LICENSE and notices are copied into packages/ by `pnpm generate`, so an edit
# to those also changes a package file and publishes.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".agents/**"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish next
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Creates the release tags and uploads the tarballs.
      contents: write
      # npm trusted publishing: npmjs.com trusts publish.yml in this repo for
      # both packages (publish and dist-tag), so no npm token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: package.json
          cache: true
      # The siyahi-shots tests render pages in Playwright's headless Chromium.
      - name: Install Chromium
        run: pnpm --filter @siyahi/tools exec playwright install --with-deps --only-shell chromium
      - name: Check, build and test
        run: vp run check
      # N is one past the highest next.N on npm or among the v* release tags.
      - name: Version as <base>-next.<N>
        id: version
        run: node .github/scripts/next-version.mjs
      - name: Pack the tarballs
        run: pnpm --filter @siyahi/ui --filter @siyahi/tools pack --pack-destination "$PWD/release"
      # v<version> keeps every pre-release; `next` always holds the newest
      # under fixed names, so one URL installs the latest.
      - name: GitHub releases with both tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tag="v$VERSION"
          notes="Install without the npm registry (npm 12 needs allow-remote=root, also in the project's .npmrc):

          \`\`\`sh
          npm install --allow-remote=root $REPO_URL/releases/download/$tag/siyahi-ui-$VERSION.tgz
          npm install --allow-remote=root --save-dev $REPO_URL/releases/download/$tag/siyahi-tools-$VERSION.tgz
          \`\`\`"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.tgz --clobber
          else
            gh release create "$tag" release/*.tgz --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$tag" --notes "$notes"
          fi

          mkdir -p release/next
          cp "release/siyahi-ui-$VERSION.tgz" release/next/siyahi-ui-next.tgz
          cp "release/siyahi-tools-$VERSION.tgz" release/next/siyahi-tools-next.tgz
          next_notes="Rolling pre-release: always the newest build of main, now $VERSION ($GITHUB_SHA). The assets change on every merge; pin a versioned release in package.json."
          if gh release view next >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/next" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit next --notes "$next_notes"
          else
            gh release create next --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "next (rolling)" --notes "$next_notes"
          fi
          gh release upload next release/next/siyahi-ui-next.tgz release/next/siyahi-tools-next.tgz --clobber
          echo "Tarballs: $REPO_URL/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      # --ignore-scripts publishes what the check step built (each package's
      # prepublishOnly is a no-op too).
      - name: Publish to npm
        run: >-
          pnpm -r --filter @siyahi/ui --filter @siyahi/tools
          publish --tag next --access public --no-git-checks --ignore-scripts --provenance
      # Until 1.0.0 there is no stable release, so `latest` follows `next`:
      # npmjs.com shows the README and version of `latest`, and a stale one
      # misleads. Remove this step with the first stable publish.
      # npm moves dist-tags over OIDC only from 11.21; Node 24 bundles 11.19.
      - name: Point latest at this pre-release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx --yes npm@11.21.1 dist-tag add "@siyahi/ui@$VERSION" latest
          npx --yes npm@11.21.1 dist-tag add "@siyahi/tools@$VERSION" latest
          echo "npm: published $VERSION under next and latest." >> "$GITHUB_STEP_SUMMARY"
