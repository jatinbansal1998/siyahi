name: Publish

# Every merge to main publishes both packages as a pre-release under the
# `next` dist-tag. Stable versions are cut by hand.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish next
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: package.json
          cache: true
          registry-url: https://registry.npmjs.org
      - name: Check, build and test
        run: vp run check
      - name: Version as 0.x.y-next.<run number>
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          for dir in packages/ui packages/tools; do
            base="$(node -p "require('./$dir/package.json').version")"
            (cd "$dir" && npm pkg set version="$base-next.$RUN_NUMBER")
          done
      # npm shows a package's own README; the root one is @siyahi/ui's.
      - name: Copy README and LICENSE into the packages
        run: |
          cp README.md packages/ui/README.md
          cp LICENSE packages/ui/LICENSE
          cp LICENSE packages/tools/LICENSE
      # pnpm swaps workspace: and catalog: specifiers for real versions.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -r publish --tag next --access public --no-git-checks
