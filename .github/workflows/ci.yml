name: CI

# docs/ is skipped by the formatter and read by nothing else, and .claude/ holds
# only the skills symlink, which no step follows. Root *.md and .agents/ stay:
# the formatter checks them, and generate:check copies the root README and
# notices into packages/.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".claude/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Installs Vite+, Node from package.json engines, pnpm from packageManager,
      # and the workspace from the pnpm store cache.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: package.json
          cache: true
      - name: Format and lint
        run: vp check
      - name: Colour rules on the copied add-ons
        run: vp run lint:registry
      - name: Unused files, exports and dependencies
        run: vp run knip:check
      # Fails when shadcn.css, report.css, registry.lock.json or the barrel
      # differ from what packages/ui/scripts/generate.ts would write.
      - name: Generated files are current
        run: vp run generate:check

  build:
    name: Build and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: package.json
          cache: true
      # The @siyahi/ui build starts with the theme contrast check and stops on
      # a failing pair; the catalogue builds against the packed package.
      - name: Build (with the contrast check)
        run: vp run -r build
      - name: Typecheck
        run: vp run -r typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The browser suites render the catalogue in Playwright's headless Chromium.
    # Its image ships the browser and its system packages, so a run no longer
    # downloads them from the Ubuntu mirror, which once took the whole timeout.
    # The tag must match the lockfile's playwright; a mismatch fails at launch
    # with "Executable doesn't exist".
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: package.json
          cache: true
      # siyahi-page's test builds a page against @siyahi/ui as a consumer
      # would, through the package's dist.
      - name: Build @siyahi/ui
        run: vp run --filter @siyahi/ui build
      - name: Test
        run: vp test
