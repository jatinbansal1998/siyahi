name: Screenshots

# For a pull request that can change how the catalogue looks: every catalogue
# page shot by siyahi-shots at 1920 and 390 wide, light and dark, attached to
# the run as the "shots" artifact. The images are for a person to open; the run
# also fails on siyahi-shots' layout checks.
on:
  pull_request:
    paths:
      - "packages/ui/**"
      - "packages/tools/**"
      - "apps/catalogue/**"
      - "DESIGN.md"

permissions:
  contents: read

concurrency:
  group: shots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shots:
    name: Screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Same Playwright image as the CI test jobs; its tag must match the lockfile.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: package.json
          cache: true
      - name: Build
        run: vp run -r build
      - name: Shoot every catalogue page
        run: |
          pnpm --filter @siyahi/catalogue preview --port 4173 --strictPort &
          # Up to a minute for the preview server to answer.
          for attempt in $(seq 60); do
            node -e "fetch('http://localhost:4173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && break
            sleep 1
          done
          pnpm shots --out shots \
            http://localhost:4173/#/overview http://localhost:4173/#/foundations \
            http://localhost:4173/#/components http://localhost:4173/#/inputs \
            http://localhost:4173/#/layout http://localhost:4173/#/data http://localhost:4173/#/blocks
      - name: Attach the images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots/
          retention-days: 14
